name: Android Build & Release CI (APK & AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Secure Environment & API Keys (.env)
        run: |
          echo "### Generating .env securely from GitHub Secrets..."
          # Start with template
          cp .env.example .env
          
          # Inject secrets if available in GitHub Repository Secrets
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" .env
            echo "GEMINI_API_KEY injected securely."
          fi
          
          if [ -n "${{ secrets.FARSH_BAZAR_API_KEY }}" ]; then
            sed -i "s|^FARSH_BAZAR_API_KEY=.*|FARSH_BAZAR_API_KEY=${{ secrets.FARSH_BAZAR_API_KEY }}|" .env
            echo "FARSH_BAZAR_API_KEY injected securely."
          fi

      - name: Ensure Signing Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating standard debug keystore for automated signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK & AAB
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify Build Artifacts
        run: |
          echo "=== Built Artifacts ==="
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/bundle/release/
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsh-bazar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Google Play Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsh-bazar-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsh-bazar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release with APK & AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
